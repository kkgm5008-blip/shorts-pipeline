[server]
# 원본(raw) 영상 업로드 최대 용량(MB). 200000 = 200GB. 요청하신 값으로 올려는
# 두었지만, Streamlit Community Cloud 무료 티어는 디스크 최대 약 50GB, RAM
# 최대 약 2.7GB로 알려져 있어서 실제로는 이보다 훨씬 작은 파일(수 GB 이내)만
# 안정적으로 처리됩니다. 그보다 큰 파일은 업로드 자체는 될 수 있어도 처리/압축/
# 다운로드 단계에서 메모리 부족으로 실패할 가능성이 높습니다.
maxUploadSize = 200000
# 웹소켓으로 오가는 메시지 최대 크기(MB). 10000 = 10GB. 다운로드 버튼 자체는
# 이 값과 무관하게 동작하지만(파일은 별도 HTTP 경로로 전송됨), 다른 내부
# 메시지에도 여유를 주기 위해 넉넉하게 올려둡니다.
maxMessageSize = 10000

[theme]
base = "light"
# 깔끔한 SaaS 대시보드 톤(인디고/바이올렛 포인트 컬러)으로 맞춤. app.py
# 상단의 커스텀 CSS(카드/탭/버튼 스타일)와 같은 팔레트를 쓰도록 통일했다.
primaryColor = "#6C5CE7"
backgroundColor = "#FAFAFC"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1F2333"
font = "sans serif"
