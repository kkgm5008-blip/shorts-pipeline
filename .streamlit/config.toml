[server]
# 원본(raw) 영상 업로드 최대 용량(MB). 예전에는 200000(200GB)까지 열어뒀지만,
# 브라우저로 직접 업로드한 파일은 Streamlit이 서버 메모리에 통째로 먼저
# 올린 뒤에야 코드가 실행되기 때문에, 파이썬 코드로는 그 시점을 막을 수
# 없었습니다. 그래서 큰 영상(1GB 이상, 특히 몇 시간짜리 긴 영상)을 올리면
# 업로드 도중 서버 전체가 죽는 사고가 반복됐습니다. 이제 Streamlit 자체
# 기능으로 업로드 크기를 여기서 하드 제한합니다 - 이 값보다 큰 파일은
# 브라우저에서 바로 거부되고 서버까지 올라오지 않습니다. 그보다 큰 영상은
# 유튜브에 올린 뒤 링크로 넣거나(서버가 직접 다운로드, 메모리 부담 적음),
# 영상을 여러 구간으로 나눠서 올려주세요.
maxUploadSize = 500
# 웹소켓으로 오가는 메시지 최대 크기(MB). 10000 = 10GB. 다운로드 버튼 자체는
# 이 값과 무관하게 동작하지만(파일은 별도 HTTP 경로로 전송됨), 다른 내부
# 메시지에도 여유를 주기 위해 넉넉하게 올려둡니다.
maxMessageSize = 10000

[theme]
base = "light"
# 깔끔한 SaaS 대시보드 톤(인디고/바이올렛 포인트 컬러)으로 맞춤. app.py
# 상단의 커스텀 CSS(카드/탭/버튼 스타일)와 같은 팔레트를 쓰도록 통일했다.
primaryColor = "#6C5CE7"
backgroundColor = "#FAFAFC"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1F2333"
font = "sans serif"
