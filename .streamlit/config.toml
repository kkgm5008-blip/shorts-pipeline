[server]
# 원본(raw) 영상 업로드 최대 용량(MB). 브라우저로 직접 업로드한 파일은
# Streamlit이 서버 메모리에 통째로 먼저 올린 뒤에야 코드가 실행되기 때문에,
# 이 값을 키울수록 큰 파일 업로드 중 서버가 죽을 위험도 같이 커집니다
# (500MB로 한 번 낮춰서 안전하게 막았던 적이 있습니다). 사용자 요청으로
# 다시 넉넉하게 올려두지만, 그래도 예전의 200000(200GB)처럼 사실상 무제한은
# 아니고 5000(5GB)으로 제한합니다. 정말 큰 영상은 여전히 유튜브/구글드라이브
# 링크로 넣는 쪽이(서버가 직접 스트리밍 다운로드, 메모리 부담 없음) 더
# 안전합니다.
maxUploadSize = 5000
# 웹소켓으로 오가는 메시지 최대 크기(MB). 10000 = 10GB. 다운로드 버튼 자체는
# 이 값과 무관하게 동작하지만(파일은 별도 HTTP 경로로 전송됨), 다른 내부
# 메시지에도 여유를 주기 위해 넉넉하게 올려둡니다.
maxMessageSize = 10000

[theme]
base = "light"
# 깔끔한 SaaS 대시보드 톤(인디고/바이올렛 포인트 컬러)으로 맞춤. app.py
# 상단의 커스텀 CSS(카드/탭/버튼 스타일)와 같은 팔레트를 쓰도록 통일했다.
primaryColor = "#6C5CE7"
backgroundColor = "#FAFAFC"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1F2333"
font = "sans serif"
